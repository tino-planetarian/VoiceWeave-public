[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceweave-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2", "numpy>=2,<3", "sherpa-onnx>=1.13,<2"]
build = ["pyinstaller>=6,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["voiceweave_worker*"]

[tool.setuptools.package-data]
voiceweave_worker = ["model_catalog.json", "model_catalog_accurate.json", "model_catalog_parakeet_ja.json", "model_catalog_parakeet_en.json", "cuda_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
